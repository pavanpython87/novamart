[project]
name = "novamart-data-pipeline"
version = "0.1.0"
description = "NovaMart end-to-end multi-channel retail data pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
