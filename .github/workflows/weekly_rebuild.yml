name: Weekly Rebuild

on:
  schedule:
    - cron: "0 4 * * 0"    # 4:00 AM UTC every Sunday
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        if: ${{ vars.BQ_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Rebuild weekly mart tables
        env:
          WAREHOUSE_BACKEND: ${{ vars.BQ_PROJECT_ID != '' && 'both' || 'duckdb' }}
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python scripts/run_pipeline.py --mode rebuild-marts --scope weekly

      - name: Export weekly Excel report
        run: python scripts/run_pipeline.py --mode export --formats excel

      - name: Commit weekly exports
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "pipeline@novamart.dev"
          git add data/logs/ data/exports/
          git commit -m "Weekly rebuild $(date +%Y-%m-%d) [skip ci]" || true
          git push || true
