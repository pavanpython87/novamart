name: Monthly Refresh

on:
  schedule:
    - cron: "0 3 1 * *"    # 3:00 AM UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        if: ${{ vars.BQ_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Full pipeline refresh
        env:
          WAREHOUSE_BACKEND: ${{ vars.BQ_PROJECT_ID != '' && 'both' || 'duckdb' }}
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python scripts/run_pipeline.py --mode full-refresh

      - name: Rebuild all mart tables
        env:
          WAREHOUSE_BACKEND: ${{ vars.BQ_PROJECT_ID != '' && 'both' || 'duckdb' }}
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: python scripts/run_pipeline.py --mode rebuild-marts --scope all

      - name: Export monthly reports
        run: python scripts/run_pipeline.py --mode export --formats csv excel pdf

      - name: Commit monthly reports
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "pipeline@novamart.dev"
          git add data/logs/ data/exports/
          git commit -m "Monthly refresh $(date +%Y-%m-%d) [skip ci]" || true
          git push || true
