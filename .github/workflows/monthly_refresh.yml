name: Monthly Refresh

on:
  schedule:
    - cron: "0 3 1 * *"    # 3:00 AM UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write BigQuery service account key
        if: ${{ secrets.BQ_PROJECT_ID != '' }}
        run: echo '${{ secrets.BQ_SERVICE_ACCOUNT }}' > ${{ runner.temp }}/gcp-key.json

      - name: Full pipeline refresh
        env:
          WAREHOUSE_BACKEND: ${{ secrets.BQ_PROJECT_ID != '' && 'both' || 'duckdb' }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: python scripts/run_pipeline.py --mode full-refresh

      - name: Rebuild all mart tables
        run: python scripts/run_pipeline.py --mode rebuild-marts --scope all

      - name: Export monthly reports
        run: python scripts/run_pipeline.py --mode export --formats csv excel pdf

      - name: Commit monthly reports
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "pipeline@novamart.dev"
          git add data/logs/ data/exports/
          git commit -m "Monthly refresh $(date +%Y-%m-%d) [skip ci]" || true
          git push || true
