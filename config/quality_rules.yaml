# Validation rule definitions, evaluated by src/validation/rules_engine.py.
#
# Rules are keyed by *canonical* dataset name (orders / shipments), not by
# raw channel (shopify/amazon/pos/fedex/ups/usps). Validation runs after
# canonical field mapping (see src/orchestration/flows/main_pipeline.py
# build_orders()/build_shipments_fact()) so one rule set — written against
# canonical column names — applies correctly across every channel, instead
# of each channel's raw native columns (e.g. Shopify's "Total"/"Created at"
# vs Amazon's "item-price" vs FedEx's "TrackingNumber"/"ShipDate").

orders:
  required_columns: [order_id, order_date, gross_revenue]
  business_rules:
    - rule: gross_revenue_positive
      column: gross_revenue
      condition: ">= 0"
      on_fail: quarantine
    - rule: order_date_not_future
      column: order_date
      condition: "<= today"
      on_fail: quarantine

shipments:
  required_columns: [tracking_number, ship_date_key]
  business_rules:
    - rule: delivery_after_ship
      condition: "delivery_date_key >= ship_date_key"
      on_fail: warn

referential_integrity:
  - orders.sku_must_exist_in_products
  - orders.customer_must_exist_in_customers
  - shipments.order_must_exist_in_orders
